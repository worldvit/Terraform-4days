# PR 을 열면 plan, main 에 병합되면 apply
name: terraform

on:
  pull_request:
    branches: [main]
    paths: ["infra/**", "modules/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["infra/**", "modules/**", ".github/workflows/terraform.yml"]

# OIDC 로 AWS 임시 자격증명을 받으려면 id-token: write 가 필요
permissions:
  id-token: write
  contents: read

# 같은 state 에 두 실행이 겹치지 않게 한 번에 하나씩
concurrency:
  group: terraform
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: AWS 자격증명 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: fmt
        run: terraform fmt -check -recursive ..

      - name: init
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: validate
        run: terraform validate

      - name: plan
        run: terraform plan -input=false -no-color

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: AWS 자격증명 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: init
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: apply
        run: terraform apply -input=false -auto-approve
